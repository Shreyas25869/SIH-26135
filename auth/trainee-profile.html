<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trainee Profile - RozgarMitra</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="profile-page"><header class="profile-header"><div class="brand"><span class="logo">R</span><strong>RozgarMitra</strong></div><button class="link-button" data-logout>Sign out</button></header><section class="profile-card"><div class="profile-title"><span class="eyebrow">TRAINEE PORTAL</span><h1>Trainee Profile</h1><p>Keep your personal information current for training and employment tracking.</p></div><div id="profile-message" class="profile-message"></div><form id="profile-form"><div class="profile-grid"><label class="field"><span>Full name</span><input id="full_name" type="text" placeholder="Your full name" required></label><label class="field"><span>Account email</span><input id="email" type="email" placeholder="Account email" readonly></label><label class="field"><span>Date of birth</span><input id="date_of_birth" type="date"></label><label class="field"><span>Mobile number</span><input id="phone" type="tel"></label><label class="field"><span>Gender</span><select id="gender"><option value=""></option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></label><label class="field"><span>District</span><input id="district" type="text"></label><label class="field"><span>City</span><input id="city" type="text"></label><label class="field"><span>State</span><input id="state" type="text" value="Maharashtra"></label><label class="field"><span>Preferred language</span><input id="preferred_language" type="text" placeholder="e.g. Marathi"></label><label class="field"><span>Highest qualification</span><input id="education_level" type="text"></label><label class="field"><span>Employment status</span><select id="employment_status"><option value=""></option><option value="Employed">Employed</option><option value="Unemployed">Unemployed</option><option value="Apprenticeship">Apprenticeship</option><option value="Self-employed">Self-employed</option><option value="Higher studies">Higher studies</option></select></label><label class="field full"><span class="check-row"><input id="consent_given" type="checkbox"><span>I consent to the use of my profile information for training and employment tracking.</span></span></label></div><div class="profile-actions"><button class="primary" type="submit">Save Profile</button><button class="secondary" type="button" id="back-btn">Back to Portal</button></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/roles.js"></script><script src="js/auth.js"></script><script src="js/guard.js"></script><script src="js/profiles.js"></script><script>initProfile('trainee');</script></body></html>
