<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employer Profile - RozgarMitra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .page {
            min-height: 100vh;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .profile-heading {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 35px;
        }

        .profile-photo {
            width: 100px;
            height: 100px;
            display: grid;
            place-items: center;
        }

        .section {
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            font-family: inherit;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .profile-heading {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">

        <div class="brand">
            <div class="logo">R</div>
            <strong>RozgarMitra</strong>
        </div>

        <a href="dashboard.html">Dashboard</a>

    </header>


    <main class="container">

        <div class="profile-heading">

            <div class="profile-photo">
                Logo
            </div>

            <div>
                <h1>Employer Profile</h1>
                <p>Manage company and hiring information.</p>
            </div>

        </div>


        <section class="section">

            <h2>Company Information</h2>

            <div class="form-grid">

                <div class="field">
                    <label>Company Name</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>Industry</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>Company Registration ID</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>Company Size</label>

                    <select>
                        <option>Select company size</option>
                        <option>1-10</option>
                        <option>11-50</option>
                        <option>51-200</option>
                        <option>201-500</option>
                        <option>500+</option>
                    </select>

                </div>

                <div class="field">
                    <label>Company Type</label>

                    <select>
                        <option>Select type</option>
                        <option>Private</option>
                        <option>Public</option>
                        <option>Government</option>
                        <option>Startup</option>
                        <option>NGO</option>
                    </select>

                </div>

            </div>

        </section>


        <section class="section">

            <h2>Location</h2>

            <div class="form-grid">

                <div class="field">
                    <label>District</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>State</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>City</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>PIN Code</label>
                    <input type="text">
                </div>

                <div class="field full">
                    <label>Company Address</label>
                    <textarea></textarea>
                </div>

            </div>

        </section>


        <section class="section">

            <h2>Contact Information</h2>

            <div class="form-grid">

                <div class="field">
                    <label>Contact Person</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>Designation</label>
                    <input type="text">
                </div>

                <div class="field">
                    <label>Phone Number</label>
                    <input type="tel">
                </div>

                <div class="field">
                    <label>Email</label>
                    <input type="email">
                </div>

                <div class="field">
                    <label>Website</label>
                    <input type="url">
                </div>

            </div>

        </section>


        <section class="section">

            <h2>Hiring Information</h2>

            <div class="form-grid">

                <div class="field full">

                    <label>Job Roles</label>

                    <textarea
                        placeholder="Example: Web Developer, Data Entry Operator, Electrician">
                    </textarea>

                </div>

                <div class="field full">

                    <label>Skills Required</label>

                    <textarea
                        placeholder="List the skills you usually require from candidates">
                    </textarea>

                </div>

                <div class="field">

                    <label>Typical Hiring Type</label>

                    <select>
                        <option>Select</option>
                        <option>Full Time</option>
                        <option>Part Time</option>
                        <option>Contract</option>
                        <option>Internship</option>
                    </select>

                </div>

            </div>

        </section>


        <div class="buttons">

            <button type="button">
                Save Profile
            </button>

            <button type="button">
                Back
            </button>

        </div>

    </main>

</div>

</body>
</html>
