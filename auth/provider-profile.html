<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training Provider Profile - RozgarMitra</title><link rel="stylesheet" href="css/auth.css"></head><body><main class="profile-page"><header class="profile-header"><div class="brand"><span class="logo">R</span><strong>RozgarMitra</strong></div><button class="link-button" data-logout>Sign out</button></header><section class="profile-card"><div class="profile-title"><span class="eyebrow">TRAINING PROVIDER PORTAL</span><h1>Training Provider Profile</h1><p>Manage the organization details used by the training and batch modules.</p></div><div id="profile-message" class="profile-message"></div><form id="profile-form"><div class="profile-grid"><label class="field"><span>Organization name</span><input id="organization_name" type="text" placeholder="Organization name" required></label><label class="field"><span>Provider type</span><select id="provider_type"><option value="">Select type</option><option value="Government">Government</option><option value="Private">Private</option><option value="NGO">NGO</option><option value="Educational Institution">Educational Institution</option><option value="Other">Other</option></select></label><label class="field"><span>Account email</span><input id="email" type="email" readonly></label><label class="field"><span>Phone</span><input id="phone" type="tel"></label><label class="field full"><span>Address</span><input id="address" type="text"></label><label class="field"><span>District</span><input id="district" type="text"></label><label class="field"><span>City</span><input id="city" type="text"></label></div><div class="profile-actions"><button class="primary" type="submit">Save Profile</button><button class="secondary" type="button" id="back-btn">Back to Portal</button></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script>
