<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SIH 26135 Login</title>
</head>
<body>

  <h1>SIH 26135 Login</h1>

  <form id="loginForm">
    <input
      id="email"
      type="email"
      placeholder="Email"
      required
    >

    <br><br>

    <input
      id="password"
      type="password"
      placeholder="Password"
      required
    >

    <br><br>

    <button type="submit">Login</button>
  </form>

  <p id="message"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
