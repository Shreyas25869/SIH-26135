<!doctype html><html lang="en"><head><link rel="stylesheet" href="styles.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outcome Dashboard</title></head><body><main><div style="display:flex;justify-content:space-between;align-items:center;gap:16px"><h1>Outcome Dashboard</h1><button id="logoutButton" type="button">Sign out</button></div><p id="status">Loading...</p><ul><li>Follow-ups: <span id="followups">0</span></li><li>Employment history: <span id="history">0</span></li><li>Skill gaps: <span id="gaps">0</span></li><li>Notifications: <span id="notifications">0</span></li></ul></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="../auth/js/roles.js"></script><script src="../auth/js/module-guard.js"></script><script src="js/dashboard.js"></script><script>document.getElementById("logoutButton").addEventListener("click",async()=>{try{await window.SIHAuth.signOut();window.SIHAuth.redirectToLogin();}catch(e){document.getElementById("status").textContent=e.message;}});</script></body></html>
