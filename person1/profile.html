<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile — SIH 26135 Person 1</title><link rel="stylesheet" href="styles.css">
</head>
<body><main class="app-shell">
<header class="topbar"><div class="brand"><div class="brand-mark">SIH</div><div><strong>Person 1 · Profile</strong><small>SIH 26135</small></div></div><button id="logoutButton" class="btn btn-ghost">Sign out</button></header>
<nav class="navbar"><a href="dashboard.html">Dashboard</a><a href="register.html">Registration</a><a class="active" href="profile.html">Profile</a><a href="training.html">Training</a><a href="skills.html">Skills</a></nav>
<section class="panel"><div class="section-head"><div><h1 class="page-title">Trainee profile</h1><p class="page-subtitle">Update the core profile associated with your authenticated account.</p></div></div>
<form id="profileForm"><div class="form-grid">
<div class="form-group"><label for="full_name">Full name *</label><input id="full_name" required></div>
<div class="form-group"><label for="email">Account email</label><input id="email" type="email" readonly></div>
<div class="form-group"><label for="phone">Phone *</label><input id="phone" required></div>
<div class="form-group"><label for="date_of_birth">Date of birth *</label><input id="date_of_birth" type="date" required></div>
<div class="form-group"><label for="gender">Gender *</label><select id="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="form-group"><label for="education_level">Education *</label><select id="education_level" required><option value="">Select</option><option>10th Pass</option><option>12th Pass</option><option>ITI Graduate</option><option>Diploma</option><option>Graduate</option><option>Post Graduate</option></select></div>
<div class="form-group"><label for="district">District *</label><input id="district" required></div>
<div class="form-group"><label for="city">City *</label><input id="city" required></div>
<div class="form-group"><label for="employment_status">Current status</label><select id="employment_status"><option value="">Not set</option><option>Employed</option><option>Unemployed</option><option>Apprenticeship</option><option>Self-employed</option><option>Higher studies</option></select></div>
</div>
<div class="consent"><label class="check-row"><input id="consent_given" type="checkbox"><span>I consent to collection and processing of training and career outcome information for government monitoring and evaluation.</span></label></div>
<div class="form-actions end"><button id="saveButton" class="btn btn-primary">Save changes</button></div></form>
<p id="message" class="form-message"></p></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="../auth/js/roles.js"></script><script src="../auth/js/module-guard.js"></script><script src="js/auth.js"></script><script src="js/profile.js"></script>
</body></html>
