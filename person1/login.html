<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — SIH 26135</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-shell">
    <section class="panel login-card">
      <div class="brand">
        <div class="brand-mark">SIH</div>
        <div><strong>SIH 26135</strong><small>Trainee Outcome Portal</small></div>
      </div>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to manage your trainee record.</p>
      <form id="loginForm" class="stack">
        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        </div>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
      <p id="message" class="form-message"></p>
      <p class="muted">Need an account? Create it in Supabase Auth first, or use your team's shared authentication page.</p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
